name: Sync Fork From Upstream

on:
  schedule:
    - cron: "19 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: lowiqentity/APEX
  DOWNSTREAM_BRANCH: main

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      changed: ${{ steps.candidate.outputs.changed }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Resolve and merge the exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" main
          upstream=$(git rev-parse FETCH_HEAD)
          changed=true
          tree=""
          if git merge-base --is-ancestor "$upstream" "$base"; then
            changed=false
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git merge --no-edit "$upstream"
            tree=$(git rev-parse 'HEAD^{tree}')
          fi
          {
            echo "base=$base"
            echo "upstream=$upstream"
            echo "changed=$changed"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}
      - name: Reconstruct and validate the exact candidate without credentials
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          scripts/validate-downstream.sh

  finalize:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base }}
      - name: Publish only the validated tree from the current base
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          actual_base=$(git ls-remote origin "refs/heads/${DOWNSTREAM_BRANCH}" | awk '{print $1}')
          if [[ "$actual_base" != "$BASE_SHA" ]]; then
            echo "::error::Downstream advanced during validation; refusing stale publication"
            exit 1
          fi
          trusted_finalizer="$RUNNER_TEMP/finalize-upstream-sync.sh"
          cp scripts/finalize-upstream-sync.sh "$trusted_finalizer"
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          bash "$trusted_finalizer"
