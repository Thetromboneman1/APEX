name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install feed test dependency
        run: python3 -m pip install PyYAML
      - name: Test release inventory failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Validate downstream feed and documentation contract
        run: scripts/validate-downstream.sh
